services:
  sui:
    build: .
    ports:
      - "3000:3000"
      # Raw UDP/TCP inbounds (Hysteria2, TUIC, Reality...): publish the port
      # here and bind the inbound to :: in s-ui.
      # - "20000:20000/udp"
    volumes:
      - data:/data
    environment:
      # Caddy listens here; keep it in step with the published port above.
      - PORT=3000
      # Passed through from the host / platform env when set (see .env.example).
      - PUBLIC_HOST
      - PANEL_PATH
      - SUB_PATH
      - WS_SECRET
      - ADMIN_USER
      - ADMIN_PASSWORD
      # Komari agent: starts only when both endpoint and token are set.
      - AGENT_ENDPOINT
      - AGENT_TOKEN
      - AGENT_INTERVAL
      - AGENT_DISABLE_WEB_SSH
      - AGENT_IGNORE_UNSAFE_CERT

volumes:
  data:
